name: Release

# A `v*` tag builds every package into a draft release and publishes it (as a
# pre-release) once every build has uploaded; if any build fails it stays a
# draft. Pushing a `release-test/...` branch does the same builds as a dry run
# and keeps the files as workflow artifacts only.
on:
  push:
    tags: ["v*"]
    branches: ["release-test/**"]

permissions:
  contents: write

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
  TAG: ${{ github.ref_name }}

jobs:
  draft:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --prerelease --verify-tag               --title "MarkDraft $TAG" --notes-file .github/release-notes.md

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows ARM64 is cross-compiled; WiX cannot build ARM64 MSIs reliably, so NSIS only.
          - { name: Windows x64, os: windows-latest, platform: windows, bundles: "nsis,msi", builds: "x86_64-pc-windows-msvc:x64" }
          - { name: Windows x86, os: windows-latest, platform: windows, bundles: "nsis,msi", builds: "i686-pc-windows-msvc:x86" }
          - { name: Windows ARM64, os: windows-latest, platform: windows, bundles: "nsis", builds: "aarch64-pc-windows-msvc:arm64" }
          # One job for all three: the universal build compiles both architectures anyway.
          - { name: macOS, os: macos-latest, platform: macos, bundles: "dmg", builds: "aarch64-apple-darwin:arm64 x86_64-apple-darwin:x64 universal-apple-darwin:universal" }
          - { name: Linux x64, os: ubuntu-22.04, platform: linux, bundles: "appimage,deb,rpm", builds: "x86_64-unknown-linux-gnu:x64" }
          - { name: Linux ARM64, os: ubuntu-22.04-arm, platform: linux, bundles: "appimage,deb,rpm", builds: "aarch64-unknown-linux-gnu:arm64" }
    runs-on: ${{ matrix.os }}
    env:
      # Signing turns on by itself once the secrets exist (see docs/SIGNING.md).
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_WINDOWS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
      HAS_WINDOWS_TEST_CERT: ${{ secrets.WINDOWS_TEST_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev             libayatana-appindicator3-dev librsvg2-dev patchelf             pkg-config zlib1g-dev libfuse2 xdg-utils

      - name: Rust targets
        id: targets
        shell: bash
        run: |
          targets=""
          for spec in ${{ matrix.builds }}; do
            t=${spec%%:*}
            if [[ $t == universal-apple-darwin ]]; then continue; fi
            targets="$targets,$t"
          done
          echo "list=${targets#,}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.targets.outputs.list }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ---- macOS: Developer ID signing + notarisation ----------------------
      - name: Configure macOS signing
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        shell: bash
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      # Without a Developer ID, sign ad hoc: Apple Silicon then shows the
      # "unidentified developer" prompt instead of "app is damaged".
      - name: Configure macOS ad-hoc signing
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING != 'true'
        shell: bash
        run: |
          echo '{"bundle":{"macOS":{"signingIdentity":"-"}}}' > src-tauri/tauri.signing.json
          echo "EXTRA_TAURI_ARGS=--config src-tauri/tauri.signing.json" >> "$GITHUB_ENV"

      # ---- Windows: self-signed test certificate (not trusted by others) --
      - name: Configure Windows test signing
        if: runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING != 'true' && env.HAS_WINDOWS_TEST_CERT == 'true'
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_TEST_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_TEST_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "markdraft-test.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $password = ConvertTo-SecureString $env:CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          @{ bundle = @{ windows = @{
              certificateThumbprint = $cert.Thumbprint
              digestAlgorithm = "sha256"
              timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 5 | Set-Content src-tauri/tauri.signing.json
          "EXTRA_TAURI_ARGS=--config src-tauri/tauri.signing.json" >> $env:GITHUB_ENV

      # ---- Windows: Azure Artifact Signing ---------------------------------
      - name: Configure Windows signing
        if: runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING == 'true'
        shell: bash
        run: |
          cargo install --locked artifact-signing-cli
          cat > src-tauri/tauri.signing.json <<JSON
          {
            "bundle": {
              "windows": {
                "signCommand": "artifact-signing-cli -e ${{ vars.AZURE_SIGNING_ENDPOINT }} -a ${{ vars.AZURE_SIGNING_ACCOUNT }} -c ${{ vars.AZURE_SIGNING_PROFILE }} -d MarkDraft %1"
              }
            }
          }
          JSON
          {
            echo "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}"
            echo "AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}"
            echo "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}"
            echo "EXTRA_TAURI_ARGS=--config src-tauri/tauri.signing.json"
          } >> "$GITHUB_ENV"

      - name: Build and package
        shell: bash
        run: |
          for spec in ${{ matrix.builds }}; do
            target=${spec%%:*} arch=${spec##*:}
            echo "::group::$target"
            pnpm tauri build --target "$target" --bundles ${{ matrix.bundles }} $EXTRA_TAURI_ARGS
            if [[ $target != universal-apple-darwin ]]; then
              cargo build --release --locked -p cli --target "$target"
            fi
            bash scripts/package-release.sh "$target" ${{ matrix.platform }} "$arch"
            echo "::endgroup::"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}-${{ strategy.job-index }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

      - name: Attach to the draft release
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/* --clobber

  checksums:
    name: Checksums
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true
      - run: |
          cd packages
          sha256sum * | tee ../SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: SHA256SUMS.txt
      - if: env.PUBLISH == 'true'
        run: gh release upload "$TAG" SHA256SUMS.txt --clobber
      - name: Publish the release
        if: env.PUBLISH == 'true' && needs.build.result == 'success'
        run: gh release edit "$TAG" --draft=false
