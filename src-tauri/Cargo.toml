[package]
name = "markdraft"
description = "MarkDraft desktop app: a thin Tauri layer over the core crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "markdraft"

[lib]
name = "markdraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
anyhow.workspace = true
cli.workspace = true
clap.workspace = true
dunce.workspace = true
export.workspace = true
fs-index.workspace = true
md-core.workspace = true
percent-encoding.workspace = true
search.workspace = true
serde.workspace = true
serde_json.workspace = true
trash.workspace = true
vcs.workspace = true
workspace.workspace = true
tauri = { workspace = true, features = [] }
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
winreg.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
